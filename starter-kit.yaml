export_paths:
  - config/statamic/assets.php
  - config/statamic/cp.php
  - config/statamic/static_caching.php
  - content/assets/assets.yaml
  - content/collections/pages.yaml
  - content/navigation
  - content/trees/navigation
  - content/globals/contact_details.yaml
  - public/images
  - public/build
  - resources/blueprints
  - resources/css
  - resources/fieldsets
  - resources/forms
  - resources/js
  - resources/views
  - package.json
  - vite.config.js
dependencies:
  alt-design/alt-akismet: ^2.0
  alt-design/alt-cookies: ^1.1
  alt-design/alt-inbound: ^2.0
  alt-design/alt-redirect: ^1.6
  alt-design/alt-seo: ^1.2
  alt-design/alt-sitemap: ^1.3
modules:
  riffraff:
    prompt: 'Install RiffRaff, which holds spam form submissions for review? It needs a RiffRaff account.'
    dependencies:
      alt-design/alt-riffraff: ^1.6
  google_maps:
    prompt: 'Install Alt Google Maps, a location fieldtype with map tags?'
    dependencies:
      alt-design/alt-google-maps: ^1.1
  live_editor:
    prompt: 'Install Alt Live Editor, for editing content by clicking it in Live Preview?'
    dependencies:
      alt-design/alt-live-editor: ^1.0
  tabs:
    prompt: 'Install Alt Tabs, for tabs inside Replicator, Bard, Grid and Group fields?'
    dependencies:
      alt-design/alt-tabs: ^1.0
